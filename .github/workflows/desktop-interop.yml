name: desktop-cross-runtime-ffi
on:
  push:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'interop/**'
      - '.github/workflows/desktop-interop.yml'
  pull_request:
    paths:
      - 'README.md'
      - 'docs/**'
      - 'CMakeLists.txt'
      - 'src/**'
      - 'include/**'
      - 'tests/**'
      - 'fixtures/**'
      - 'interop/**'
      - '.github/workflows/desktop-interop.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  dotnet-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27f2c9aa6d67a7e2302ba27d643907fa28c352f9
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="727948bdaa80a5a2f8b391673eb7ad01235dcae78d4de7481c80aae74fa4e156" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: cmake -S . -B build-interop -DATTO_DESKTOP_BUILD_SHARED=ON -DBUILD_TESTING=ON
      - run: cmake --build build-interop --parallel 2
      - run: ctest --test-dir build-interop --output-on-failure
      - name: Execute .NET FFI lifecycle test
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-interop
        run: dotnet run -c Release --project interop/dotnet/AttoDesktopInterop.csproj
  dotnet-nativeaot-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27f2c9aa6d67a7e2302ba27d643907fa28c352f9
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="727948bdaa80a5a2f8b391673eb7ad01235dcae78d4de7481c80aae74fa4e156" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: cmake -S . -B build-interop -DATTO_DESKTOP_BUILD_SHARED=ON -DBUILD_TESTING=ON
      - run: cmake --build build-interop --parallel 2
      - name: Publish native executable without JIT or managed fallback
        run: >
          dotnet publish interop/dotnet/AttoDesktopInterop.csproj -c Release
          -r linux-x64 -p:PublishAot=true -p:SelfContained=true
          -o build-interop/dotnet-native
      - name: Execute published NativeAOT host bridge (not an Atto guest)
        env:
          LD_LIBRARY_PATH: ${{ github.workspace }}/build-interop
        run: |
          file build-interop/dotnet-native/AttoDesktopInterop
          ./build-interop/dotnet-native/AttoDesktopInterop
  dotnet-windows:
    runs-on: windows-2022
    timeout-minutes: 25
    steps:
      # Preserve raw Git blobs for both the SHA-256 pin and exact-byte guard.
      - name: Disable Windows Git newline rewriting before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "cannot configure byte-exact Git checkout" }
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27f2c9aa6d67a7e2302ba27d643907fa28c352f9
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: pwsh
        run: |
          python -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="727948bdaa80a5a2f8b391673eb7ad01235dcae78d4de7481c80aae74fa4e156" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -I "$env:RUNNER_TEMP/ores-desktop-pinned-verifier.py"
          if ($LASTEXITCODE -ne 0) { throw "raw checkout source verification failed" }
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - shell: pwsh
        run: |
          cmake -S . -B build-interop -DATTO_DESKTOP_BUILD_SHARED=ON -DBUILD_TESTING=ON
          if ($LASTEXITCODE -ne 0) { throw "cmake configure failed" }
          cmake --build build-interop --config Release
          if ($LASTEXITCODE -ne 0) { throw "cmake build failed" }
          ctest --test-dir build-interop -C Release --output-on-failure
          if ($LASTEXITCODE -ne 0) { throw "ctest failed" }
          $env:PATH = "$PWD\build-interop\Release;" + $env:PATH
          dotnet run -c Release --project interop/dotnet/AttoDesktopInterop.csproj
          if ($LASTEXITCODE -ne 0) { throw ".NET FFI probe failed" }
  dotnet-macos:
    runs-on: macos-15
    timeout-minutes: 25
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27f2c9aa6d67a7e2302ba27d643907fa28c352f9
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="727948bdaa80a5a2f8b391673eb7ad01235dcae78d4de7481c80aae74fa4e156" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - uses: actions/setup-dotnet@26b0ec14cb23fa6904739307f278c14f94c95bf1
        with:
          dotnet-version: '10.0.x'
      - run: cmake -S . -B build-interop -DATTO_DESKTOP_BUILD_SHARED=ON -DBUILD_TESTING=ON
      - run: cmake --build build-interop --parallel 2
      - run: ctest --test-dir build-interop --output-on-failure
      - name: Execute .NET FFI lifecycle test
        env:
          DYLD_FALLBACK_LIBRARY_PATH: ${{ github.workspace }}/build-interop
        run: dotnet run -c Release --project interop/dotnet/AttoDesktopInterop.csproj
  graalvm-native-image-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27f2c9aa6d67a7e2302ba27d643907fa28c352f9
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="727948bdaa80a5a2f8b391673eb7ad01235dcae78d4de7481c80aae74fa4e156" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: graalvm
          java-version: '25'
      - run: cmake -S . -B build-interop -DATTO_DESKTOP_BUILD_SHARED=ON -DBUILD_TESTING=ON
      - run: cmake --build build-interop --parallel 2
      - name: Compile Java FFM host bridge
        run: javac -d build-interop/ffm interop/graalvm/DesktopInteropProbe.java
      - name: Build native-image with explicit foreign metadata, no fallback
        run: |
          command -v native-image
          native-image --no-fallback --enable-native-access=ALL-UNNAMED \
            -H:ConfigurationFileDirectories=interop/graalvm \
            -cp build-interop/ffm DesktopInteropProbe \
            -o build-interop/desktop-interop-native
      - name: Execute GraalVM Native Image bridge (not an Atto guest)
        run: |
          file build-interop/desktop-interop-native
          ./build-interop/desktop-interop-native "$PWD/build-interop/libores_desktop.so"
  graalvm-jdk25-linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: 27f2c9aa6d67a7e2302ba27d643907fa28c352f9
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="727948bdaa80a5a2f8b391673eb7ad01235dcae78d4de7481c80aae74fa4e156" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad
        with:
          distribution: graalvm
          java-version: '25'
      - run: cmake -S . -B build-interop -DATTO_DESKTOP_BUILD_SHARED=ON -DBUILD_TESTING=ON
      - run: cmake --build build-interop --parallel 2
      - run: ctest --test-dir build-interop --output-on-failure
      - name: Compile Java 25 FFM bridge
        run: javac -d build-interop/ffm interop/graalvm/DesktopInteropProbe.java
      - name: Execute Java/GraalVM FFM lifecycle test (JVM, not Native Image)
        run: java --enable-native-access=ALL-UNNAMED -cp build-interop/ffm DesktopInteropProbe "$PWD/build-interop/libores_desktop.so"
