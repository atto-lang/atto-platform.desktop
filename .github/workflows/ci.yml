name: desktop-host-ci
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  linux-gcc:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: db3717cd0b2e2bc3ef542848582dc51238c7d768
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="bb2b487c59826eefe075edc93cf3cb7ed56ae81c6efa09ac40afb25d3f51e6d9" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - name: Exercise raw-checkout security regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_checkout_raw.py' -q
      - name: Exercise portable checkout security regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_checkout_windows.py' -q
      - name: Exercise pinned-verifier trust-boundary regressions
        run: python3 -m unittest discover -s scripts -p 'test_pinned_verifier_guard.py' -q
      - name: Validate integration shell syntax
        run: bash -n scripts/llvm-link-smoke.sh
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DORES_DESKTOP_WITH_SDL3=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  linux-clang:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: db3717cd0b2e2bc3ef542848582dc51238c7d768
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="bb2b487c59826eefe075edc93cf3cb7ed56ae81c6efa09ac40afb25d3f51e6d9" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - name: Exercise raw-checkout security regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_checkout_raw.py' -q
      - name: Exercise portable checkout security regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_checkout_windows.py' -q
      - name: Exercise pinned-verifier trust-boundary regressions
        run: python3 -m unittest discover -s scripts -p 'test_pinned_verifier_guard.py' -q
      - run: cmake -S . -B build -DCMAKE_C_COMPILER=clang -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DORES_DESKTOP_WITH_SDL3=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  macos:
    runs-on: macos-15
    timeout-minutes: 20
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: db3717cd0b2e2bc3ef542848582dc51238c7d768
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="bb2b487c59826eefe075edc93cf3cb7ed56ae81c6efa09ac40afb25d3f51e6d9" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - name: Exercise raw-checkout security regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_checkout_raw.py' -q
      - name: Exercise portable checkout security regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_checkout_windows.py' -q
      - name: Exercise pinned-verifier trust-boundary regressions
        run: python3 -m unittest discover -s scripts -p 'test_pinned_verifier_guard.py' -q
      - run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DORES_DESKTOP_WITH_SDL3=OFF
      - run: cmake --build build --parallel 2
      - run: ctest --test-dir build --output-on-failure
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    steps:
      # Preserve raw Git blobs for both the SHA-256 pin and exact-byte guard.
      - name: Disable Windows Git newline rewriting before checkout
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          if ($LASTEXITCODE -ne 0) { throw "cannot configure byte-exact Git checkout" }
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: db3717cd0b2e2bc3ef542848582dc51238c7d768
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: pwsh
        run: |
          python -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="bb2b487c59826eefe075edc93cf3cb7ed56ae81c6efa09ac40afb25d3f51e6d9" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: pwsh
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          python -I "$env:RUNNER_TEMP/ores-desktop-pinned-verifier.py"
          if ($LASTEXITCODE -ne 0) { throw "raw checkout source verification failed" }
      - name: Exercise Windows-compatible checkout regressions
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p 'test_verify_checkout_windows.py' -q
          if ($LASTEXITCODE -ne 0) { throw "checkout regression tests failed" }
      - name: Exercise pinned-verifier trust-boundary regressions
        shell: pwsh
        run: |
          python -m unittest discover -s scripts -p 'test_pinned_verifier_guard.py' -q
          if ($LASTEXITCODE -ne 0) { throw "pinned-verifier guard regressions failed" }
      - run: cmake -S . -B build -DBUILD_TESTING=ON -DORES_DESKTOP_WITH_SDL3=OFF
      - run: cmake --build build --config Release --parallel 2
      - run: ctest --test-dir build -C Release --output-on-failure

  linux-sanitizers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # Immutable *content* pin, not an independent trust root until reviewed/protected.
      - name: Checkout pinned verifier commit (same private repository)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: db3717cd0b2e2bc3ef542848582dc51238c7d768
          persist-credentials: false
      - name: Pin verifier bytes outside candidate checkout
        shell: bash
        run: |
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path("scripts/verify-checkout-raw.py").read_bytes(); digest=hashlib.sha256(raw).hexdigest(); digest=="bb2b487c59826eefe075edc93cf3cb7ed56ae81c6efa09ac40afb25d3f51e6d9" or sys.exit("PINNED_VERIFIER_REJECTED: SHA256 mismatch"); pathlib.Path(os.environ["RUNNER_TEMP"],"ores-desktop-pinned-verifier.py").write_bytes(raw)'
      - name: Checkout candidate exact source HEAD
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify exact source head
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/ores-desktop-pinned-verifier.py"
      - name: Exercise raw-checkout security regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_checkout_raw.py' -q
      - name: Exercise portable checkout security regressions
        run: python3 -m unittest discover -s scripts -p 'test_verify_checkout_windows.py' -q
      - name: Exercise pinned-verifier trust-boundary regressions
        run: python3 -m unittest discover -s scripts -p 'test_pinned_verifier_guard.py' -q
      - run: >
          cmake -S . -B build-sanitize -DCMAKE_C_COMPILER=clang
          -DCMAKE_BUILD_TYPE=Debug -DBUILD_TESTING=ON -DORES_DESKTOP_WITH_SDL3=OFF
          -DCMAKE_C_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - run: cmake --build build-sanitize --parallel 2
      - run: ctest --test-dir build-sanitize --output-on-failure
