# Candidate for default-branch review ONLY; no PR checkout, build, caches,
# external source mirrors, artifact uploads, or token writes.
# The pinned policy blob is not independently trusted until approved on protected main.
name: desktop-trusted-pr-metadata-policy
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  sourcefree-policy:
    if: github.repository == 'ores-truffle-oreslang/oreslang-platform.desktop' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Fetch exact candidate policy blob from same repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api --method GET repos/ores-truffle-oreslang/oreslang-platform.desktop/git/blobs/4f92494e54aa8273c27ed67cc6245a3848a54bc0 --jq .content | base64 -d > "$RUNNER_TEMP/desktop-trusted-policy.py"
          python3 -I -c 'import hashlib,os,pathlib,sys; raw=pathlib.Path(os.environ["RUNNER_TEMP"],"desktop-trusted-policy.py").read_bytes(); sys.exit(0 if hashlib.sha256(raw).hexdigest()=="d3269e7206e63691eddbf6d80c4012ef1e0466235300efe5f7e5f55dab93f7e2" else "POLICY_BLOB_MISMATCH")'
      - name: Run pinned default-branch policy against PR metadata only
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I "$RUNNER_TEMP/desktop-trusted-policy.py"
