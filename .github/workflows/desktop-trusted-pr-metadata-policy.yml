# Candidate for default-branch review only. Not a required check until private
# branch protection, trusted workflow provenance and runner admission work.
# NO untrusted PR checkout, source transfer, artifacts, caches or token writes.
name: desktop-trusted-pr-metadata-policy
on:
  pull_request_target:
    types: [opened, reopened, synchronize, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, dismissed]
permissions:
  contents: read
  pull-requests: read
jobs:
  sourcefree-policy:
    if: github.repository == 'ores-truffle-oreslang/oreslang-platform.desktop' && github.event.pull_request.base.ref == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout trusted PR base SHA only (never PR code)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
      - name: Read-only fail-closed metadata policy
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 -I scripts/trusted_policy.py
