name: source-platform-member-governance (metadata only)
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  member-contract:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Confirm exact PR head before validation
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$EXPECTED_HEAD" =~ ^[0-9a-f]{40}$ ]]
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          # A clean HEAD alone does not prove that the physical manifest and
          # tests match Git blobs (including case aliases or ignored files).
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(git ls-files --others --ignored --exclude-standard)"
          for file in .oreslang/integration.json tests/platform-member-governance.test.mjs .github/workflows/platform-member-governance.yml; do
            test "$(git hash-object --no-filters "$file")" = "$(git rev-parse "HEAD:$file")"
          done
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Reject false platform governance and execution claims
        run: node --test tests/platform-member-governance.test.mjs
